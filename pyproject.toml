[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "detecao-pavimento"
version = "0.1.0"
description = "Classificação de pavimentos usando visão computacional e transfer learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "tensorflow>=2.15",
  "opencv-python>=4.8",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "pillow>=10.0",
  "patool>=2.0",
]

[project.optional-dependencies]
gpu = [
  "tensorflow[and-cuda]>=2.15",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["src*"]
